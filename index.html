<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>因数切り出しゲーム</title>
<style>
:root{--bg:#10172d;--card:#192342;--ink:#f6f7ff;--muted:#aeb9d8;--accent:#65e6bb;--red:#ff5f72;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263765,#10172d 60%);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);min-height:100vh}main{width:min(720px,100%);margin:auto;padding:18px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(20px,5vw,30px)}button{font:inherit;color:var(--ink);border:0;border-radius:14px;cursor:pointer}.ghost{background:#ffffff15;padding:9px 12px;font-size:13px}.panel{background:#ffffff0d;border:1px solid #ffffff18;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 18px 50px #0003}.stagebar{display:flex;gap:6px;margin:12px 0}.stage{flex:1;padding:8px 3px;text-align:center;border-radius:12px;background:#ffffff12;color:var(--muted);font-size:12px}.stage.active{background:var(--accent);color:#102039;font-weight:800}.stage.done{background:#6d72ff;color:#fff}.label{color:var(--muted);font-size:13px}.question{font-size:clamp(35px,10vw,64px);font-weight:900;text-align:center;margin:22px 0 8px;letter-spacing:.03em;min-height:1.25em}.question.keep{font-size:clamp(23px,6vw,40px);margin:10px 0}.answer{text-align:center;min-height:68px;font-size:clamp(28px,8vw,50px);font-weight:900;color:var(--gold);padding:10px}.answer.glow{animation:glow 1.2s infinite alternate}@keyframes glow{to{text-shadow:0 0 12px var(--gold),0 0 28px var(--accent);transform:scale(1.04)}}.hint{background:#ffe08a;color:#352700;padding:12px;border-radius:15px;line-height:1.65;margin:10px 0;font-size:14px}.feedback{text-align:center;min-height:28px;color:var(--muted);font-weight:700}.feedback.bad{color:var(--red)}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.key{background:#27355c;min-height:54px;font-size:22px;font-weight:800;box-shadow:inset 0 -3px #1118}.key:active{transform:translateY(2px)}.key.special{background:#b04461}.key.letter{background:#4266a7}.key.clear{background:#606c8d;font-size:15px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px;background:#ffffff15}.primary{background:var(--accent)!important;color:#092237!important;font-weight:900}.timer{height:10px;border-radius:10px;background:#ffffff18;overflow:hidden;margin:9px 0}.timer i{display:block;height:100%;background:var(--gold);width:100%;transition:width .1s linear}.challenge{color:var(--gold);font-weight:900;text-align:center}.modal{position:fixed;inset:0;background:#081022dd;display:grid;place-items:center;padding:20px}.modalbox{background:#1b284b;border:1px solid #ffffff2b;border-radius:24px;padding:24px;max-width:420px;text-align:center}.hidden{display:none!important}.small{font-size:12px;color:var(--muted);line-height:1.6}
</style></head><body><main>
<div class="top"><div class="brand">因数切り出しゲーム</div><button class="ghost" id="reset">最初から</button></div>
<div class="stagebar" id="stagebar"></div>
<section class="panel"><div class="label" id="modeLabel"></div><div id="challenge" class="challenge hidden">10秒チャレンジ：切り出せる数を急いで選ぼう！</div><div class="timer hidden" id="timer"><i></i></div><div class="question" id="question"></div><div class="answer" id="answer"></div><div class="feedback" id="feedback"></div><div id="hint" class="hint hidden"></div><div class="actions"><button id="hintBtn">ヒント</button><button id="next" class="primary hidden">次の問題</button></div><div class="keys" id="keys"></div></section>
<p class="small">式を割り切れる共通因数を電卓から選びます。正解すると、式が因数に切り出されます。</p>
</main><div class="modal hidden" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" id="modalBtn" style="padding:12px 22px">進む</button></div></div>
<script>
const stages=[
 {name:'ステージ1',keys:['1','2','3','4','5','6','7','8','9','0'],qs:[['6x＋9','3','3（2x＋3）','6÷3＝2、9÷3＝3'],['8a＋12','4','4（2a＋3）','8÷4＝2、12÷4＝3'],['10y＋15','5','5（2y＋3）','10÷5＝2、15÷5＝3'],['14x＋21','7','7（2x＋3）','14÷7＝2、21÷7＝3']]},
 {name:'ステージ2',keys:['1','2','3','4','5','6','7','8','9','0'],qs:[['12x＋18','6','6（2x＋3）','12÷6＝2、18÷6＝3'],['16a−24','8','8（2a−3）','16÷8＝2、24÷8＝3'],['20y＋30','10','10（2y＋3）','20÷10＝2、30÷10＝3'],['18x＋27','9','9（2x＋3）','18÷9＝2、27÷9＝3']]},
 {name:'ステージ3',keys:['1','2','3','4','5','6','7','8','9','0','x','a'],qs:[['6x²＋9x','3x','3x（2x＋3）','6x²÷3x＝2x、9x÷3x＝3'],['8a²＋12a','4a','4a（2a＋3）','8a²÷4a＝2a、12a÷4a＝3'],['10x²−15x','5x','5x（2x−3）','10x²÷5x＝2x、15x÷5x＝3'],['12a²＋18a','6a','6a（2a＋3）','12a²÷6a＝2a、18a÷6a＝3']]},
 {name:'ステージ4',keys:['1','2','3','4','5','6','7','8','9','0','x','y','−'],qs:[['−8y²＋12y','−4y','−4y（2y−3）','−8y²÷−4y＝2y、12y÷−4y＝−3'],['−6x²−9x','−3x','−3x（2x＋3）','−6x²÷−3x＝2x、−9x÷−3x＝3'],['15a²−20a','5a','5a（3a−4）','15a²÷5a＝3a、−20a÷5a＝−4'],['−12y²−18y','−6y','−6y（2y＋3）','−12y²÷−6y＝2y、−18y÷−6y＝3']]}
];
let si=0,qi=0,challenge=false,done=false,timerId=null,answer='';let qEl=document.querySelector('#question'),aEl=document.querySelector('#answer'),fEl=document.querySelector('#feedback'),hEl=document.querySelector('#hint'),keysEl=document.querySelector('#keys');
function renderStages(){document.querySelector('#stagebar').innerHTML=stages.map((s,i)=>`<div class="stage ${i===si?'active':''} ${i<si?'done':''}">${s.name}</div>`).join('')}
function current(){return stages[si].qs[qi]}
function renderKeys(){keysEl.innerHTML=stages[si].keys.map(k=>`<button class="key ${k==='−'?'special':''} ${/[a-z]/.test(k)?'letter':''}" data-key="${k}">${k}</button>`).join('')+`<button class="key clear" data-key="clear">クリア</button>`;keysEl.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.key))}
function render(){renderStages();renderKeys();let q=current();document.querySelector('#modeLabel').textContent=`${stages[si].name}　問題 ${qi+1}/${stages[si].qs.length}${challenge?'　◆10秒チャレンジ':''}`;qEl.textContent=q[0];qEl.classList.toggle('keep',!!answer);aEl.textContent=answer?'':'？';aEl.classList.remove('glow');fEl.textContent='';fEl.className='feedback';hEl.classList.add('hidden');document.querySelector('#hintBtn').disabled=false;document.querySelector('#next').classList.add('hidden');document.querySelector('#challenge').classList.toggle('hidden',!challenge);document.querySelector('#timer').classList.toggle('hidden',!challenge);if(challenge)startTimer()}
function press(k){if(done)return;if(k==='clear'){answer='';aEl.textContent='？';return}answer+=k;aEl.textContent=answer;let q=current();if(answer===q[1]){aEl.textContent=q[2];aEl.classList.add('glow');fEl.textContent='切り出し成功！';document.querySelector('#next').classList.remove('hidden');document.querySelector('#hintBtn').disabled=true;clearInterval(timerId)}else if(answer.length>=q[1].length&&!q[1].startsWith(answer)){fEl.textContent='その数では両方を割り切れない！';fEl.className='feedback bad';document.querySelector('.panel').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],220);answer='';setTimeout(()=>aEl.textContent='？',250)}}
function hint(){let q=current();hEl.innerHTML=`<b>ヒント</b><br>この式の各項を同じ数で割ります。<br>${q[3]}<br><small>2つの項をどちらも割り切れる数を探そう。</small>`;hEl.classList.remove('hidden')}
function startTimer(){clearInterval(timerId);let left=10,bar=document.querySelector('#timer i');bar.style.width='100%';timerId=setInterval(()=>{left-=.1;bar.style.width=Math.max(0,left/10*100)+'%';if(left<=0){clearInterval(timerId);timeout()}},100)}
function timeout(){fEl.textContent='時間切れ！次の問題へ';fEl.className='feedback bad';setTimeout(next,650)}
function next(){clearInterval(timerId);if(qi<stages[si].qs.length-1){qi++;answer='';render();return}if(!challenge){challenge=true;qi=0;answer='';render();return}challenge=false;if(si<stages.length-1){si++;qi=0;answer='';showModal(`${stages[si].name}へ！`,'ここから新しいキーが使えるようになります。');render()}else{done=true;showModal('基本ステージクリア！','ランダムモードが解放されました。');}}
function showModal(t,txt){document.querySelector('#modalTitle').textContent=t;document.querySelector('#modalText').textContent=txt;document.querySelector('#modal').classList.remove('hidden');document.querySelector('#modalBtn').onclick=()=>document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#hintBtn').onclick=hint;document.querySelector('#next').onclick=next;document.querySelector('#reset').onclick=()=>{si=0;qi=0;challenge=false;done=false;answer='';render()};render();
</script></body></html>
